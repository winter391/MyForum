Jwt:
  accessTokenSecret: "yourAccessTokenSecret"
  refreshTokenSecret: "yourRefreshTokenSecret"
  accessTokenExpireTime: 1800
  refreshTokenExpireTime: 10080

spring:
  datasource:
    url: jdbc:mysql://yourIP:3306/MyForum?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: yourUsername
    password: "yourPassword"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  rabbitmq:
    host: yourIP
    port: 5672
    username: yourUsername
    password: "yourPassword"
    virtual-host: MyForum
    publisher-confirm-type: correlated
    publisher-returns: true
    code:
      main-exchanger: main

  data:
    redis:
      host: yourIP
      port: 6379
      password: "yourPassword"
      lettuce:
        pool:
          max-active: 30
          max-idle: 20
          min-idle: 10
          max-wait: 3000
    code:
      online-user-terminal-key: "onlineUserTerminal"